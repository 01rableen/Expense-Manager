<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>

        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body{
            background: linear-gradient(90deg, #000000, #0d2818, #000000);
            height: 100vh;
            width: 100vw;
            position: relative;
            display: flex;
            flex-direction: column;
        }
        #navContainer{
            height: 75px;
            width: 100 vw;
            background:linear-gradient(90deg , black , rgb(53, 52, 52));
             nav{
                height: 100%;
                width: 95%;
                display: flex;
                justify-content: space-between;
                align-items: center;
                margin:auto;

                img{
                    border-radius: 20px;
                }

                p{
                    color: white;
                    font-family: "Outfit", sans-serif;
                    font-size: 30px;
                }
                ul{
                   list-style: none;
                   display: flex;
                   align-items: center;
                   font-family: "Outfit", sans-serif;

                  li{
                    margin: 0px 30px;
                    font-size: 20px;
                    color: white;

                    button{
                    border-radius: 20px;
                    background: linear-gradient(#0E6E56, #0B2415);
                    font-size: 16px;
                    color: white;
                    height: 45px;
                    width: 110px;
                    font-family: "Outfit", sans-serif;
                    border: none;
                    cursor: pointer;
                  }
                }
                }
                ul li a {
                   text-decoration : none;

                }
            }
        }
        #loginBox{
            height: calc(100vh - 70px);
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #loginCard{
            width: 500px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1) , 0 2px 4px -1px rgba(0,0,0,0.6);
            padding: 36px 32px;
            display: flex;
            flex-direction: column;
            gap: 18px;
            background-color: #0d1f15;
            border: 1px solid #2a5a3a;

            header{
                font-size: 24px;
                text-align: center;
                color: white;
                font-family: sans-serif;
            }
        }
        .loginForm{
            display: flex;
            flex-direction: column;
            gap: 16px;
            width: 100%;
        }
        .label{
            color: white;
            font-family: sans-serif;
            font-size: 18px;
        }
        .input{
            height: 50px;
            width: 100%;
            border: 1.5px solid #2a5a3a;
            outline: none;
            padding: 10px 20px;
            background: rgba(0,0,0,0.3);
            border-radius: 10px;
            color: #ffffff;
            font-size:15px;
            font-family: sans-serif;
        }
        .btnLogin{
            border: 1.5px solid #3ddc84;
            border-radius : 20px;
            margin-top: 17px;
            color: #bbd1cc;
            width: 100%;
            height: 44px;
            font-size: 25px;
            cursor: pointer;
            background: #1a7a3a;
            font-family: sans-serif;
            transition: background 0.2s , color 0.2s;
        }
        .btnLogin:hover{
            background-color: #3ddc84;
            color: #000;
        }
        #footer a{
            display: flex;
            flex-direction: column;
            gap: 6px;
            color: white;
            text-align: center;
            font-size: 13px;
            color: #aaa;
        }
        #footer a:hover{
            text-decoration: none;
            color: #3ddc84;
            font-weight: 500;
        }
        .formGroup{
            display: flex;
            flex-direction: column;
            gap: 8px;
            width: 100%;
        }
    </style>
</head>
<body>
<section id="navContainer">
    <nav>
        <picture>
            <a href=""><img src="/project-img/spendlyLogo.jpeg" alt="spendly" height="75px" width="200px" ></a>
        </picture>
        <p>SPEND SMARTER , LIVE BETTER</p>

        <ul>
            <a href="/landing.html"><li>Home</li></a>
            <a href="/landing.html"><li>About us</li></a>
            <a href="/Register.html"><li>Sign Up</li></a>
            <a href="/login.html"><li><button>Get Started</button></li></a>
        </ul>
    </nav>
</section>
<section id="loginBox">
    <article id="loginCard">
        <header>LOG IN</header>
        <main>
            <form action="" id="loginForm">
                <div class="formGroup">
                    <label for="email" class="label">Email or Phone Number:</label>
                    <input type="text" class="input" id="email" placeholder="Enter email or Phone">
                </div>
                <div class="formGroup">
                    <label for="Password" class="label">Password:</label>
                    <input type="password" name="" id="Password" class="input" placeholder="Enter Password">
                </div>
                <div class="formGroup">
                    <button type="submit" class="btnLogin">Login</button>
                </div>
            </form>
        </main>
        <footer id="footer">
            <p><a href="">Don't have an Account? | Register</a></p>
        </footer>
    </article>
</section>
<script src="app.js"></script>
</body>
</html>
